<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - StudentHub</title>

    <link rel="stylesheet" href="../CSS/styles.css">
    <script src="../JAVASCRIPT/script.js" defer></script>
</head>

<body>
<div class="page">

    <header class="site-header">
        <a href="index.html" class="logo">StudentHub</a>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="faq.html">FAQ</a>
            <a href="feedback.html">Feedback</a>
            <a href="contact.html">Contact</a>
            <a href="admin.html">Admin</a>
        </nav>

        <div class="header-actions">
            <button class="theme-toggle" type="button"
                    aria-label="Switch to dark theme">🌙</button>
            <button class="hamburger" type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false">☰</button>
        </div>
    </header>

    <div class="notification-banner" role="status">
        <span>Contact the StudentHub team for help or information.</span>
        <button class="notification-close" type="button"
                aria-label="Dismiss notification">×</button>
    </div>

    <main>
        <section class="content-grid">

            <div class="card">
                <h1 class="section-title">Talk to Our Team</h1>

                <div class="box">
                    <h3>Email</h3>
                    <p>support@example.com</p>
                </div>

                <div class="box section-gap">
                    <h3>Phone</h3>
                    <p>+91 12345 67890</p>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">Headquarters</h2>

                <div class="box">
                    <h3>Address</h3>
                    <p>StudentHub Campus</p>
                    <p>Gujarat, India</p>
                </div>
            </div>

        </section>

        <section class="card">
            <h2 class="section-title">Send Us a Message</h2>

           <form action="/practical/contact.php" method="POST">

                <label for="contactName">Full Name</label>
                <input type="text" id="contactName" name="name"
                       maxlength="100" required>

                <label for="contactEmail">Email Address</label>
                <input type="email" id="contactEmail" name="email"
                       maxlength="254" required>

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject"
                       maxlength="150" required>

                <label for="message">Message</label>
                <textarea id="message" name="message"
                          minlength="10" maxlength="5000"
                          required></textarea>

                <button type="submit" class="btn">Send Message</button>

            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 StudentHub</p>
    </footer>

</div>
</body>
</html>

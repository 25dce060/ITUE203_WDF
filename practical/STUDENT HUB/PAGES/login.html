<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudentHub</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

<div class="page">

    <header class="site-header">
        <a href="index.html" class="logo">StudentHub</a>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="dynamic.html">Dynamic Data</a>
            <a href="faq.html">FAQ</a>
            <a href="contact.html">Contact</a>
            <a href="register.html">Register</a>
        </nav>

        <div class="header-actions">
            <button class="theme-toggle" type="button" aria-label="Switch to dark theme">🌙</button>
            <button class="hamburger" type="button" aria-label="Open navigation menu" aria-expanded="false">☰</button>
        </div>
    </header>

    <div class="notification-banner" role="status">
        <span>Log in to access your student portal.</span>
        <button class="notification-close" type="button" aria-label="Dismiss notification">×</button>
    </div>

    <main>

        <section class="content-grid">

            <div class="card">
                <h1 class="section-title">Welcome Back!</h1>
                <p>Access your student information, campus events, and support pages.</p>
            </div>

            <div class="card">
                <h2 class="section-title">Login</h2>

                <form action="/practical/login.php" method="POST">

                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" name="studentId" required>

                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required>

                    <button type="submit" class="btn">Login</button>

                </form>

                <p class="section-gap">
                    Don't have an account?
                    <a href="register.html">Register here</a>.
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 StudentHub</p>
    </footer>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depstar - Home</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="page">
    <header class="site-header">
        <div class="logo">DEPSTAR</div>

        <nav class="nav">
            <a href="index.html" class="active">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="faq.html">FAQ</a>
            <a href="feedback.html">Feedback</a>
            <a href="contact.html">Contact</a>

        <div class="header-actions">
            <button class="theme-toggle" type="button" aria-label="Switch to dark theme">🌙</button>
            <button class="hamburger" type="button" aria-label="Open navigation menu" aria-expanded="false">☰</button>

            <div class="home-buttons">

        <p>© 2026 DEPSTAR Student Portal</p>

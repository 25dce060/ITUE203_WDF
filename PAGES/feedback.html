<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Depstar</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
<div class="page">
    <header class="site-header">
        <div class="logo">DEPSTAR</div>

        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="faq.html">FAQ</a>
            <a href="feedback.html" class="active">Feedback</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="header-actions">
            <button class="theme-toggle" type="button" aria-label="Switch to dark theme">🌙</button>
            <button class="hamburger" type="button" aria-label="Open navigation menu" aria-expanded="false">☰</button>
        </div>
    </header>

    <div class="notification-banner">
        <span>New campus events and student updates are now available.</span>
        <button class="notification-close" type="button" aria-label="Close notification">×</button>
    </div>

    <main>
        <section class="card feedback-card">
            <a href="faq.html" class="feedback-link">Jump to FAQ</a>

            <h1 class="section-title">Feedback Form</h1>

            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">

                <label for="feedback">Your Feedback</label>
                <textarea id="feedback" name="feedback" placeholder="Enter your feedback"></textarea>

                <button type="submit" class="btn">Submit Feedback</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 DEPSTAR Student Portal</p>
    </footer>
</div>
</body>
</html>
